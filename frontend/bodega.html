<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodega – Novum GLP</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="app-sidebar"></div>
  <div class="main-content">
    <div class="topbar">
      <div><h1>Despacho de Materiales</h1><div class="breadcrumb">Solicitudes aprobadas pendientes de entrega</div></div>
    </div>
    <div class="page-content">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Solicitante</th><th>Línea de Producción</th><th>Fecha Req.</th><th>Ítems</th><th>Total Aprobado</th><th>Aprobada</th><th>Acciones</th></tr>
            </thead>
            <tbody id="bod-tbody">
              <tr><td colspan="8" class="text-center text-muted" style="padding:32px">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal detalle entrega -->
<div class="modal-overlay hidden" id="modal-bod">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Despachar Solicitud</span>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script>
// ── Estado global ─────────────────────────────────────────────────────────────
let solicitudActual = null;

// ── Funciones globales ────────────────────────────────────────────────────────

function cerrarModal() {
  document.getElementById("modal-bod").classList.add("hidden");
  solicitudActual = null;
}

async function loadAprobadas() {
  const tbody = document.getElementById("bod-tbody");
  try {
    const data = await apiFetch("/api/bodega/aprobadas");
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><p>No hay solicitudes aprobadas pendientes de entrega.</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(s => `
      <tr>
        <td style="font-weight:600">#${s.id}</td>
        <td>${s.solicitante_nombre}</td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${s.linea_produccion_nombre}">${s.linea_produccion_nombre}</td>
        <td>${fmtDate(s.fecha_requerida)}</td>
        <td>${s.num_items}</td>
        <td style="font-weight:600">${fmtMoney(s.total)}</td>
        <td>${fmtDate(s.created_at)}</td>
        <td><button class="btn btn-primary btn-sm" onclick="abrirDespacho(${s.id})">Despachar</button></td>
      </tr>`).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" class="text-danger text-center">Error: ${err.message}</td></tr>`;
  }
}

async function abrirDespacho(id) {
  const body = document.getElementById("modal-body");
  body.innerHTML = "<p class='text-muted'>Cargando...</p>";
  document.getElementById("modal-footer").innerHTML = "";
  document.getElementById("modal-bod").classList.remove("hidden");
  try {
    const s = await apiFetch(`/api/solicitudes/${id}`);
    solicitudActual = s;
    document.getElementById("modal-title").textContent = `Despachar Solicitud #${s.id}`;
    const total = s.detalles.reduce((acc, d) => acc + ((d.cantidad_aprobada || 0) * d.precio_unitario_snapshot), 0);
    body.innerHTML = `
      <div class="form-row" style="margin-bottom:12px">
        <div><div class="form-label">Solicitante</div><p>${s.solicitante_nombre}</p></div>
        <div><div class="form-label">Línea</div><p>${s.linea_produccion_nombre}</p></div>
        <div><div class="form-label">Fecha Requerida</div><p>${fmtDate(s.fecha_requerida)}</p></div>
      </div>
      <hr class="divider">
      <div style="background:var(--warning-bg);border:1px solid #e3a008;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--warning);">
        ⚠️ Al confirmar la entrega, se descontará el stock de cada material según las cantidades aprobadas. Esta acción no se puede deshacer.
      </div>
      <div class="form-label" style="margin-bottom:8px">Materiales a Entregar</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Código</th><th>Material</th><th>Unidad</th><th>Cant. Aprobada</th><th>Precio Unit.</th><th>Subtotal</th></tr></thead>
          <tbody>
            ${s.detalles.map(d => `
              <tr>
                <td><code style="font-size:11px;background:var(--gray-100);padding:2px 5px;border-radius:3px">${d.material_codigo || "—"}</code></td>
                <td style="font-weight:500">${d.material_nombre}</td>
                <td>${d.material_unidad}</td>
                <td style="font-weight:600;color:var(--success)">${d.cantidad_aprobada ?? "—"}</td>
                <td>${fmtMoney(d.precio_unitario_snapshot)}</td>
                <td style="font-weight:600">${fmtMoney((d.cantidad_aprobada || 0) * d.precio_unitario_snapshot)}</td>
              </tr>`).join("")}
            <tr style="background:var(--gray-50)">
              <td colspan="5" class="text-right font-semibold">Total</td>
              <td style="font-weight:700">${fmtMoney(total)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
    document.getElementById("modal-footer").innerHTML = `
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-success" onclick="confirmarEntrega()">
        ✓ Confirmar Entrega y Descontar Stock
      </button>
    `;
  } catch (err) {
    body.innerHTML = `<p class="text-danger">Error: ${err.message}</p>`;
  }
}

async function confirmarEntrega() {
  if (!solicitudActual) return;
  try {
    await apiFetch(`/api/bodega/${solicitudActual.id}/entregar`, { method: "POST" });
    showToast("Entrega confirmada y stock descontado", "success");
    cerrarModal();
    loadAprobadas();
  } catch (err) {
    showToast("Error: " + err.message, "error");
  }
}

// ── Inicialización ────────────────────────────────────────────────────────────
const user = requireAuth(["bodeguero"]);
if (user) {
  renderSidebar("bodega");
  loadAprobadas();
}
</script>
</body>
</html>
