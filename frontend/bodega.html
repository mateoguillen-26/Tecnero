<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodega – Novum GLP</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .stock-ok   { color: var(--success); font-weight: 600; }
    .stock-warn { color: var(--warning); font-weight: 600; }
    .stock-err  { color: var(--danger);  font-weight: 600; }
    .stock-row-err td { background: #fff5f5 !important; }
    .bloqueo-box {
      background: var(--danger-bg); border: 1px solid #fca5a5;
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
    }
    .bloqueo-box .bloqueo-title { font-weight: 700; color: var(--danger); margin-bottom: 6px; font-size: 14px; }
    .bloqueo-box ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--danger); }
    .aviso-box {
      background: var(--warning-bg); border: 1px solid #fde68a;
      border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: var(--warning);
    }
  </style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="app-sidebar"></div>
  <div class="main-content">
    <div class="topbar">
      <div><h1>Despacho de Materiales</h1><div class="breadcrumb">Solicitudes aprobadas pendientes de entrega</div></div>
      <button class="btn btn-secondary btn-sm" onclick="loadAprobadas()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Actualizar
      </button>
    </div>
    <div class="page-content">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Solicitante</th><th>Línea de Producción</th><th>Fecha Req.</th><th>Ítems</th><th>Total Aprobado</th><th>Stock</th><th>Acciones</th></tr>
            </thead>
            <tbody id="bod-tbody">
              <tr><td colspan="8" class="text-center text-muted" style="padding:32px">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal detalle entrega -->
<div class="modal-overlay hidden" id="modal-bod">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Despachar Solicitud</span>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script>
// ── Estado global ─────────────────────────────────────────────────────────────
let solicitudActual = null;

// ── Funciones globales ────────────────────────────────────────────────────────

function cerrarModal() {
  document.getElementById("modal-bod").classList.add("hidden");
  solicitudActual = null;
}

async function loadAprobadas() {
  const tbody = document.getElementById("bod-tbody");
  tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">Cargando...</td></tr>`;
  try {
    const data = await apiFetch("/api/bodega/aprobadas");
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><p>No hay solicitudes aprobadas pendientes de entrega.</p></div></td></tr>`;
      return;
    }

    // Verificar stock de cada solicitud en paralelo
    const checks = await Promise.allSettled(
      data.map(s => apiFetch(`/api/bodega/${s.id}/verificar-stock`))
    );

    tbody.innerHTML = data.map((s, i) => {
      const check = checks[i].status === "fulfilled" ? checks[i].value : null;
      const stockOk = check ? check.stock_suficiente : null;
      const stockIcon = stockOk === null ? "—"
        : stockOk
          ? `<span class="stock-ok">✓ Disponible</span>`
          : `<span class="stock-err">⚠ Sin stock</span>`;
      return `
        <tr>
          <td style="font-weight:600">#${s.id}</td>
          <td>${s.solicitante_nombre}</td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${s.linea_produccion_nombre}">${s.linea_produccion_nombre}</td>
          <td>${fmtDate(s.fecha_requerida)}</td>
          <td>${s.num_items}</td>
          <td style="font-weight:600">${fmtMoney(s.total)}</td>
          <td>${stockIcon}</td>
          <td><button class="btn btn-primary btn-sm" onclick="abrirDespacho(${s.id})">Ver / Despachar</button></td>
        </tr>`;
    }).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" class="text-danger text-center">Error: ${err.message}</td></tr>`;
  }
}

async function abrirDespacho(id) {
  const body = document.getElementById("modal-body");
  const footer = document.getElementById("modal-footer");
  body.innerHTML = "<p class='text-muted'>Cargando...</p>";
  footer.innerHTML = "";
  document.getElementById("modal-bod").classList.remove("hidden");

  try {
    // Cargar detalle y verificación de stock en paralelo
    const [s, stockCheck] = await Promise.all([
      apiFetch(`/api/solicitudes/${id}`),
      apiFetch(`/api/bodega/${id}/verificar-stock`),
    ]);
    solicitudActual = s;
    document.getElementById("modal-title").textContent = `Despachar Solicitud #${s.id}`;

    const faltantesMap = {};
    (stockCheck.faltantes || []).forEach(f => { faltantesMap[f.codigo] = f; });
    const hayFaltantes = !stockCheck.stock_suficiente;

    const total = s.detalles.reduce((acc, d) => acc + ((d.cantidad_aprobada || 0) * d.precio_unitario_snapshot), 0);

    // Construir bloque de advertencia si hay faltantes
    let bloqueHTML = "";
    if (hayFaltantes) {
      const listaFaltantes = stockCheck.faltantes.map(f =>
        `<li><strong>${f.codigo} – ${f.nombre}</strong>: necesita <strong>${f.cantidad_necesaria} ${f.unidad}</strong>, disponible <strong>${f.stock_disponible}</strong> (faltan <strong>${f.faltante}</strong>)</li>`
      ).join("");
      bloqueHTML = `
        <div class="bloqueo-box">
          <div class="bloqueo-title">🚫 No se puede despachar — Stock insuficiente</div>
          <ul>${listaFaltantes}</ul>
          <p style="margin-top:8px;font-size:12px;color:var(--danger)">Repón el inventario desde la sección de Materiales antes de despachar.</p>
        </div>`;
    } else {
      bloqueHTML = `
        <div class="aviso-box">
          ⚠️ Al confirmar la entrega, se descontará el stock de cada material. Esta acción <strong>no se puede deshacer</strong>.
        </div>`;
    }

    body.innerHTML = `
      <div class="form-row" style="margin-bottom:12px">
        <div><div class="form-label">Solicitante</div><p>${s.solicitante_nombre}</p></div>
        <div><div class="form-label">Línea</div><p>${s.linea_produccion_nombre}</p></div>
        <div><div class="form-label">Fecha Requerida</div><p>${fmtDate(s.fecha_requerida)}</p></div>
      </div>
      <hr class="divider">
      ${bloqueHTML}
      <div class="form-label" style="margin-bottom:8px">Materiales a Entregar</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Código</th><th>Material</th><th>Unidad</th><th>Cant. Aprobada</th><th>Stock Actual</th><th>Precio Unit.</th><th>Subtotal</th><th>Estado</th></tr>
          </thead>
          <tbody>
            ${s.detalles.map(d => {
              const cantNec = d.cantidad_aprobada || 0;
              const stockAct = d.material_stock_actual ?? 0;
              const faltante = faltantesMap[d.material_codigo];
              let estadoStock, rowClass = "";
              if (cantNec <= 0) {
                estadoStock = `<span class="text-muted">—</span>`;
              } else if (stockAct >= cantNec) {
                estadoStock = `<span class="stock-ok">✓ OK</span>`;
              } else if (stockAct > 0) {
                estadoStock = `<span class="stock-err">⚠ Faltan ${faltante ? faltante.faltante : (cantNec - stockAct).toFixed(2)}</span>`;
                rowClass = "stock-row-err";
              } else {
                estadoStock = `<span class="stock-err">✕ Sin stock</span>`;
                rowClass = "stock-row-err";
              }
              return `
                <tr class="${rowClass}">
                  <td><code style="font-size:11px;background:var(--gray-100);padding:2px 5px;border-radius:3px">${d.material_codigo || "—"}</code></td>
                  <td style="font-weight:500">${d.material_nombre}</td>
                  <td>${d.material_unidad}</td>
                  <td style="font-weight:600">${cantNec}</td>
                  <td style="${stockAct < cantNec ? 'color:var(--danger);font-weight:700' : ''}">${stockAct}</td>
                  <td>${fmtMoney(d.precio_unitario_snapshot)}</td>
                  <td style="font-weight:600">${fmtMoney(cantNec * d.precio_unitario_snapshot)}</td>
                  <td>${estadoStock}</td>
                </tr>`;
            }).join("")}
            <tr style="background:var(--gray-50)">
              <td colspan="6" class="text-right font-semibold">Total</td>
              <td style="font-weight:700">${fmtMoney(total)}</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    `;

    footer.innerHTML = `
      <button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button>
      ${hayFaltantes
        ? `<button class="btn btn-danger" disabled title="Stock insuficiente para despachar">🚫 Sin stock suficiente</button>`
        : `<button class="btn btn-success" onclick="confirmarEntrega()">✓ Confirmar Entrega y Descontar Stock</button>`
      }
    `;
  } catch (err) {
    body.innerHTML = `<p class="text-danger">Error: ${err.message}</p>`;
    footer.innerHTML = `<button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button>`;
  }
}

async function confirmarEntrega() {
  if (!solicitudActual) return;
  const btn = document.querySelector("#modal-footer .btn-success");
  if (btn) { btn.disabled = true; btn.textContent = "Despachando..."; }
  try {
    await apiFetch(`/api/bodega/${solicitudActual.id}/entregar`, { method: "POST" });
    showToast("Entrega confirmada y stock descontado", "success");
    cerrarModal();
    loadAprobadas();
  } catch (err) {
    // El backend devuelve detalle de qué materiales faltan
    showToast("Error: " + err.message, "error");
    if (btn) { btn.disabled = false; btn.textContent = "✓ Confirmar Entrega y Descontar Stock"; }
  }
}

// ── Inicialización ────────────────────────────────────────────────────────────
const user = requireAuth(["bodeguero"]);
if (user) {
  renderSidebar("bodega");
  loadAprobadas();
}
</script>
</body>
</html>
