<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprobaciones – Novum GLP</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .stock-ok  { color: var(--success); font-size:12px; font-weight:600; }
    .stock-low { color: var(--warning); font-size:12px; font-weight:600; }
    .stock-err { color: var(--danger);  font-size:12px; font-weight:600; }
    .tab-nav { display:flex; gap:4px; margin-bottom:20px; border-bottom:2px solid var(--gray-200); padding-bottom:0; }
    .tab-btn { background:none; border:none; padding:10px 20px; cursor:pointer; font-size:14px; font-weight:500; color:var(--gray-500); border-bottom:2px solid transparent; margin-bottom:-2px; border-radius:4px 4px 0 0; transition:.15s; }
    .tab-btn:hover { color:var(--primary); background:var(--gray-50); }
    .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
  </style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="app-sidebar"></div>
  <div class="main-content">
    <div class="topbar">
      <div><h1>Aprobaciones</h1><div class="breadcrumb">Gestionar solicitudes y pedidos pendientes de aprobación</div></div>
    </div>
    <div class="page-content">
      <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('requerimientos', this)">Requerimientos de Producción</button>
        <button class="tab-btn" onclick="switchTab('pedidos', this)">Pedidos de Compra</button>
      </div>

      <!-- ── TAB REQUERIMIENTOS ─────────────────────────────────────────── -->
      <div id="tab-requerimientos">
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>Solicitante</th><th>Línea de Producción</th><th>Fecha Req.</th><th>Ítems</th><th>Total Est.</th><th>Recibida</th><th>Acciones</th></tr>
              </thead>
              <tbody id="req-tbody">
                <tr><td colspan="8" class="text-center text-muted" style="padding:32px">Cargando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ── TAB PEDIDOS DE COMPRA ──────────────────────────────────────── -->
      <div id="tab-pedidos" class="hidden">
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>Bodeguero</th><th>Proveedor</th><th>Ítems</th><th>Total Est.</th><th>Recibido</th><th>Acciones</th></tr>
              </thead>
              <tbody id="ped-tbody">
                <tr><td colspan="7" class="text-center text-muted" style="padding:32px">Cargando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal aprobación -->
<div class="modal-overlay hidden" id="modal-apr">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Procesar Solicitud</span>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="/js/api.js?v=4"></script>
<script src="/js/sidebar.js?v=4"></script>
<script>
let solicitudActual = null;
let tabActual = "requerimientos";

// ── Tabs ──────────────────────────────────────────────────────────────────────

function switchTab(name, btn) {
  tabActual = name;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("tab-requerimientos").classList.toggle("hidden", name !== "requerimientos");
  document.getElementById("tab-pedidos").classList.toggle("hidden", name !== "pedidos");
  if (name === "requerimientos") loadRequerimientos();
  else loadPedidos();
}

// ── REQUERIMIENTOS ────────────────────────────────────────────────────────────

async function loadRequerimientos() {
  const tbody = document.getElementById("req-tbody");
  try {
    const data = await apiFetch("/api/aprobaciones/pendientes?tipo=requerimiento");
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><p>No hay requerimientos pendientes de aprobación.</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(s => `
      <tr>
        <td style="font-weight:600">#${s.id}</td>
        <td>${s.solicitante_nombre}</td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${s.linea_produccion_nombre}">${s.linea_produccion_nombre}</td>
        <td>${fmtDate(s.fecha_requerida)}</td>
        <td>${s.num_items}</td>
        <td style="font-weight:600">${fmtMoney(s.total)}</td>
        <td>${fmtDate(s.created_at)}</td>
        <td><button class="btn btn-primary btn-sm" onclick="abrirAprobacion(${s.id}, 'requerimiento')">Revisar</button></td>
      </tr>`).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" class="text-danger text-center">Error: ${err.message}</td></tr>`;
  }
}

// ── PEDIDOS DE COMPRA ─────────────────────────────────────────────────────────

async function loadPedidos() {
  const tbody = document.getElementById("ped-tbody");
  try {
    const data = await apiFetch("/api/aprobaciones/pendientes?tipo=pedido_compra");
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><p>No hay pedidos de compra pendientes de aprobación.</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(s => `
      <tr>
        <td style="font-weight:600">#${s.id}</td>
        <td>${s.solicitante_nombre}</td>
        <td>${s.proveedor || "—"}</td>
        <td>${s.num_items}</td>
        <td style="font-weight:600">${fmtMoney(s.total)}</td>
        <td>${fmtDate(s.created_at)}</td>
        <td><button class="btn btn-primary btn-sm" onclick="abrirAprobacion(${s.id}, 'pedido_compra')">Revisar</button></td>
      </tr>`).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-danger text-center">Error: ${err.message}</td></tr>`;
  }
}

// ── MODAL APROBACIÓN (compartido) ─────────────────────────────────────────────

function cerrarModal() {
  document.getElementById("modal-apr").classList.add("hidden");
  solicitudActual = null;
}

async function abrirAprobacion(id, tipo) {
  const body = document.getElementById("modal-body");
  body.innerHTML = "<p class='text-muted'>Cargando...</p>";
  document.getElementById("modal-footer").innerHTML = "";
  document.getElementById("modal-apr").classList.remove("hidden");

  try {
    const s = await apiFetch(`/api/solicitudes/${id}`);
    solicitudActual = s;
    const esPedido = tipo === "pedido_compra";
    document.getElementById("modal-title").textContent = esPedido
      ? `Pedido de Compra #${s.id} — ${s.solicitante_nombre}`
      : `Solicitud #${s.id} — ${s.solicitante_nombre}`;

    const filasDetalles = s.detalles.map(d => {
      let stockInfo = "";
      if (!esPedido) {
        const stockAct = d.material_stock_actual ?? null;
        if (stockAct !== null) {
          if (stockAct <= 0)
            stockInfo = `<div class="stock-err">Sin stock (${stockAct})</div>`;
          else if (stockAct < d.cantidad_solicitada)
            stockInfo = `<div class="stock-low">Stock bajo: ${stockAct} ${d.material_unidad}</div>`;
          else
            stockInfo = `<div class="stock-ok">Stock OK: ${stockAct} ${d.material_unidad}</div>`;
        }
      }
      return `
        <tr>
          <td><code style="font-size:11px;background:var(--gray-100);padding:2px 5px;border-radius:3px">${d.material_codigo || "—"}</code></td>
          <td>${d.material_nombre} <span class="text-muted text-sm">(${d.material_unidad})</span>${stockInfo}</td>
          <td>${d.cantidad_solicitada}</td>
          <td>
            <input type="number" class="form-control" style="width:90px" id="apr-${d.id}"
              value="${d.cantidad_solicitada}" min="0" step="0.01"
              oninput="recalcSubtotal(${d.id}, ${d.precio_unitario_snapshot})">
          </td>
          <td>${fmtMoney(d.precio_unitario_snapshot)}</td>
          <td id="sub-${d.id}" style="font-weight:600">${fmtMoney(d.cantidad_solicitada * d.precio_unitario_snapshot)}</td>
        </tr>`;
    }).join("");

    body.innerHTML = `
      ${esPedido ? `
        <div class="form-row" style="margin-bottom:12px">
          <div><div class="form-label">Proveedor</div><p>${s.proveedor || "—"}</p></div>
          <div><div class="form-label">Creado por</div><p>${s.solicitante_nombre}</p></div>
        </div>` : `
        <div class="form-row" style="margin-bottom:12px">
          <div><div class="form-label">Línea de Producción</div><p>${s.linea_produccion_nombre}</p></div>
          <div><div class="form-label">Fecha Requerida</div><p>${fmtDate(s.fecha_requerida)}</p></div>
        </div>`}
      ${s.observaciones ? `<div class="form-group"><div class="form-label">Observaciones</div><p style="color:#374151">${s.observaciones}</p></div>` : ""}
      <hr class="divider">
      <div class="form-label" style="margin-bottom:8px">
        Materiales
        <span class="text-muted" style="font-weight:400;font-size:12px;margin-left:8px">
          ${esPedido ? "— ajusta la cantidad a aprobar si es necesario." : "— ajusta cantidades aprobadas si es necesario. Stock actual es informativo."}
        </span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Código</th><th>Material</th><th>Cant. Solicitada</th><th>Cant. Aprobada</th><th>Precio Unit.</th><th>Subtotal</th></tr>
          </thead>
          <tbody>${filasDetalles}</tbody>
        </table>
      </div>
      <hr class="divider">
      <div class="form-group">
        <label class="form-label">Comentario (opcional)</label>
        <textarea id="comentario-apr" class="form-control" placeholder="Motivo de aprobación, ajuste o rechazo..."></textarea>
      </div>`;

    document.getElementById("modal-footer").innerHTML = `
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="procesar('rechazar')">Rechazar</button>
      <button class="btn btn-success" onclick="procesar('aprobar')">Aprobar</button>`;
  } catch (err) {
    body.innerHTML = `<p class="text-danger">Error: ${err.message}</p>`;
  }
}

function recalcSubtotal(detalleId, precio) {
  const cant = parseFloat(document.getElementById(`apr-${detalleId}`)?.value || 0);
  const el = document.getElementById(`sub-${detalleId}`);
  if (el) el.textContent = fmtMoney(cant * precio);
}

async function procesar(accion) {
  if (!solicitudActual) return;
  const comentario = document.getElementById("comentario-apr")?.value || null;
  let items = null;
  if (accion === "aprobar") {
    items = solicitudActual.detalles.map(d => ({
      detalle_id: d.id,
      cantidad_aprobada: parseFloat(document.getElementById(`apr-${d.id}`)?.value ?? d.cantidad_solicitada),
    }));
  }
  try {
    const res = await apiFetch(`/api/aprobaciones/${solicitudActual.id}`, {
      method: "POST",
      body: JSON.stringify({ accion, comentario, items }),
    });
    if (res.advertencia) {
      showToast(res.advertencia, "warning", 6000);
    } else {
      showToast(`${accion === "aprobar" ? "Aprobado" : "Rechazado"} correctamente`, "success");
    }
    cerrarModal();
    if (tabActual === "requerimientos") loadRequerimientos();
    else loadPedidos();
  } catch (err) {
    showToast("Error: " + err.message, "error");
  }
}

// ── Inicialización ────────────────────────────────────────────────────────────
const user = requireAuth(["coordinador"]);
if (user) {
  renderSidebar("aprobaciones");
  loadRequerimientos();
}
</script>
</body>
</html>
