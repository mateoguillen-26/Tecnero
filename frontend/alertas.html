<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas de Stock – Novum GLP</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="app-sidebar"></div>
  <div class="main-content">
    <div class="topbar">
      <div><h1>Alertas de Stock</h1><div class="breadcrumb">Materiales con niveles de inventario críticos</div></div>
      <div class="flex gap-2">
        <label class="flex items-center gap-2" style="font-size:13px;cursor:pointer">
          <input type="checkbox" id="mostrar-inactivas"> Mostrar resueltas
        </label>
        <button class="btn btn-secondary btn-sm" onclick="loadAlertas()">Actualizar</button>
      </div>
    </div>
    <div class="page-content">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Material</th><th>Tipo</th><th>Mensaje</th><th>Stock Actual</th><th>Stock Mín.</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr>
            </thead>
            <tbody id="alertas-tbody">
              <tr><td colspan="8" class="text-center text-muted" style="padding:32px">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal crear pedido de compra desde alerta -->
<div class="modal-overlay hidden" id="modal-pedido-alerta">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Crear Pedido de Compra</span>
      <button class="modal-close" onclick="cerrarModalPedidoAlerta()">✕</button>
    </div>
    <div class="modal-body">
      <p class="text-muted" style="margin-bottom:16px;font-size:13px">
        Se creará un pedido de compra pendiente de aprobación por el coordinador.
      </p>
      <div class="form-group">
        <label class="form-label">Material</label>
        <input type="text" id="alerta-mat-nombre" class="form-control" readonly style="background:var(--gray-50)">
        <input type="hidden" id="alerta-mat-id">
      </div>
      <div class="form-group">
        <label class="form-label">Cantidad a pedir <span id="alerta-cantidad-hint" style="font-weight:400;color:var(--gray-500);font-size:12px"></span></label>
        <input type="number" id="alerta-cantidad" class="form-control" placeholder="Ej: 50" min="0.01" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">Proveedor (opcional)</label>
        <input type="text" id="alerta-proveedor" class="form-control" placeholder="Nombre del proveedor">
      </div>
      <div class="form-group">
        <label class="form-label">Observaciones (opcional)</label>
        <textarea id="alerta-observaciones" class="form-control" placeholder="Urgencia, detalles, etc."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="cerrarModalPedidoAlerta()">Cancelar</button>
      <button class="btn btn-primary" onclick="enviarPedidoAlerta()">Enviar Pedido</button>
    </div>
  </div>
</div>

<script src="/js/api.js?v=3"></script>
<script src="/js/sidebar.js?v=3"></script>
<script>
// ── Funciones globales ────────────────────────────────────────────────────────

async function loadAlertas() {
  const soloActivas = !document.getElementById("mostrar-inactivas").checked;
  const tbody = document.getElementById("alertas-tbody");
  try {
    const data = await apiFetch(`/api/alertas/?solo_activas=${soloActivas}`);
    const userLocal = getUser();
    const esBodeguero = userLocal && userLocal.rol === "bodeguero";

    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><p>${soloActivas ? "No hay alertas activas. El inventario está en buen estado." : "No hay alertas registradas."}</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(a => `
      <tr>
        <td style="font-weight:600">${a.material_nombre}</td>
        <td><span class="badge ${a.tipo === 'sin_stock' ? 'badge-rechazada' : 'badge-pendiente'}">${a.tipo === 'sin_stock' ? 'Sin Stock' : 'Stock Bajo'}</span></td>
        <td style="font-size:12px;color:var(--gray-600)">${a.mensaje}</td>
        <td>${a.stock_actual}</td>
        <td>${a.stock_minimo}</td>
        <td><span class="badge ${a.activa ? 'badge-pendiente' : 'badge-entregada'}">${a.activa ? 'Activa' : 'Resuelta'}</span></td>
        <td>${fmtDate(a.created_at)}</td>
        <td style="display:flex;gap:6px;flex-wrap:wrap">
          ${a.activa ? `<button class="btn btn-secondary btn-sm" onclick="resolver(${a.id})">Resolver</button>` : "—"}
          ${a.activa && esBodeguero ? `<button class="btn btn-primary btn-sm" onclick="abrirModalPedidoAlerta(${a.material_id}, '${a.material_nombre.replace(/'/g,"\\'")}', ${Math.max(0, a.stock_minimo - a.stock_actual)})">Pedir</button>` : ""}
        </td>
      </tr>`).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" class="text-danger text-center">Error: ${err.message}</td></tr>`;
  }
}

async function resolver(id) {
  if (!confirm("¿Marcar esta alerta como resuelta? Se reactivará automáticamente si el stock vuelve a bajar del mínimo.")) return;
  try {
    await apiFetch(`/api/alertas/${id}/resolver`, { method: "POST" });
    showToast("Alerta resuelta", "success");
    loadAlertas();
  } catch (err) {
    showToast("Error: " + err.message, "error");
  }
}

function abrirModalPedidoAlerta(materialId, materialNombre, cantidadSugerida) {
  document.getElementById("alerta-mat-id").value = materialId;
  document.getElementById("alerta-mat-nombre").value = materialNombre;
  document.getElementById("alerta-cantidad").value = cantidadSugerida > 0 ? cantidadSugerida : "";
  document.getElementById("alerta-cantidad-hint").textContent = cantidadSugerida > 0 ? `(sugerido: ${cantidadSugerida} para alcanzar stock mínimo)` : "";
  document.getElementById("alerta-proveedor").value = "";
  document.getElementById("alerta-observaciones").value = "";
  document.getElementById("modal-pedido-alerta").classList.remove("hidden");
}

function cerrarModalPedidoAlerta() {
  document.getElementById("modal-pedido-alerta").classList.add("hidden");
}

async function enviarPedidoAlerta() {
  const matId = parseInt(document.getElementById("alerta-mat-id").value);
  const cantidad = parseFloat(document.getElementById("alerta-cantidad").value);

  if (!matId || !cantidad || cantidad <= 0) {
    showToast("Ingresa una cantidad válida", "warning");
    return;
  }

  const payload = {
    proveedor: document.getElementById("alerta-proveedor").value || null,
    observaciones: document.getElementById("alerta-observaciones").value || null,
    items: [{ material_id: matId, cantidad }],
  };

  const btn = document.querySelector("#modal-pedido-alerta .btn-primary");
  btn.disabled = true; btn.textContent = "Enviando...";
  try {
    await apiFetch("/api/bodega/pedidos", { method: "POST", body: JSON.stringify(payload) });
    showToast("Pedido de compra enviado al coordinador para aprobación", "success");
    cerrarModalPedidoAlerta();
  } catch (err) {
    showToast("Error: " + err.message, "error");
  } finally {
    btn.disabled = false; btn.textContent = "Enviar Pedido";
  }
}

// ── Inicialización ────────────────────────────────────────────────────────────
const user = requireAuth(["coordinador", "bodeguero"]);
if (user) {
  renderSidebar("alertas");
  document.getElementById("mostrar-inactivas").addEventListener("change", loadAlertas);
  loadAlertas();
}
</script>
</body>
</html>
